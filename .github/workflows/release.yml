name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          # RELEASE_TOKEN is a PAT belonging to an admin account. The default
          # GITHUB_TOKEN runs as github-actions[bot], which the main branch
          # ruleset's pull_request rule doesn't exempt (only the repo-admin
          # role is bypassed), so it can't push the release commit/tag below.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          # See RELEASE_TOKEN note above.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: npx semantic-release
